name: Public Python quality caller proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/python-quality-caller-proof.yml

permissions: {}

jobs:
  quality:
    name: quality
    permissions:
      contents: read
    uses: alpininsight/.github/.github/workflows/python-quality.yml@79ae576aa0dd865d6cf33402c63929fd4021dd2a
    with:
      python_versions: '["3.14"]'
      run_uv_sync: false
      run_pre_commit: false
      run_gitleaks: true
      lint_command: ''
      format_command: ''
      django_check_command: ''
      test_command: python3 -I -B -m unittest discover -s scripts -p 'test_*.py' -v
