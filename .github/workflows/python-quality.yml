name: Public Python quality

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/python-quality.yml
      - docs/public-ci-and-release-reusables.md
  workflow_call:
    inputs:
      python_versions:
        description: JSON array of Python versions for the quality matrix.
        type: string
        required: true
      working_directory:
        description: Directory that contains the project and test suite.
        type: string
        default: .
      uv_sync_args:
        description: Arguments appended to `uv sync`.
        type: string
        default: --locked
      run_uv_sync:
        description: Sync project dependencies with uv before quality commands.
        type: boolean
        default: true
      quality_node_version:
        description: Optional Node.js version for quality commands; empty skips Node setup.
        type: string
        default: ''
      run_pre_commit:
        description: Run pre-commit before linting and tests.
        type: boolean
        default: true
      run_gitleaks:
        description: Run Gitleaks once as a dedicated security check.
        type: boolean
        default: true
      gitleaks_version:
        description: Gitleaks release version without a leading v.
        type: string
        default: '8.30.1'
      gitleaks_sha256:
        description: SHA256 of the official linux_x64 Gitleaks release archive.
        type: string
        default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      pre_commit_command:
        description: Command used for pre-commit validation. An empty value skips the step.
        type: string
        default: SKIP=no-commit-to-branch uv run --locked pre-commit run --all-files
      lint_command:
        description: Command used for linting. An empty value skips the step.
        type: string
        default: uv run --locked ruff check .
      format_command:
        description: Command used for format checking. An empty value skips the step.
        type: string
        default: uv run --locked ruff format --check .
      django_check_command:
        description: Optional Django system check command. An empty value skips the step.
        type: string
        default: ''
      test_command:
        description: Command used for the test suite. An empty value skips the step.
        type: string
        default: uv run --locked pytest
      timeout_minutes:
        description: Timeout in minutes for each quality matrix leg.
        type: number
        default: 45

permissions: {}

jobs:
  self-test:
    name: Lint public Python quality workflow
    if: github.event_name == 'pull_request' && !contains(toJSON(inputs), '"python_versions"')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout the PR test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm the quality workflow is present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/python-quality.yml').read_text()
          assert 'workflow_call:' in text
          assert 'name: Gitleaks' in text
          PY

  quality:
    name: Quality (${{ matrix.python_version }})
    if: contains(toJSON(inputs), '"python_versions"')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(inputs.python_versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: false
      - name: Set up Node.js for quality commands
        if: inputs.quality_node_version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.quality_node_version }}
          package-manager-cache: false
      - name: Sync dependencies
        if: inputs.run_uv_sync
        env:
          UV_SYNC_ARGS: ${{ inputs.uv_sync_args }}
        run: |
          # Arguments are a trusted caller input and must word-split.
          # shellcheck disable=SC2086
          uv sync $UV_SYNC_ARGS
      - name: Configure isolated pre-commit environment
        if: inputs.run_pre_commit && inputs.pre_commit_command != ''
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: printf 'PRE_COMMIT_HOME=%s\n' "$RUNNER_TEMP/pre-commit/py${PYTHON_VERSION}" >> "$GITHUB_ENV"
      - name: Keep Gitleaks out of pre-commit matrix
        if: inputs.run_pre_commit && inputs.run_gitleaks && inputs.pre_commit_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if [ -f .pre-commit-config.yaml ]; then
            awk '
              /^  - repo: https:\/\/github.com\/gitleaks\/gitleaks$/ { skip = 1; next }
              skip && /^  - repo: / { skip = 0 }
              !skip { print }
            ' .pre-commit-config.yaml > "$RUNNER_TEMP/pre-commit-config.yaml"
            mv "$RUNNER_TEMP/pre-commit-config.yaml" .pre-commit-config.yaml
          fi
      - name: Run pre-commit
        if: inputs.run_pre_commit && inputs.pre_commit_command != ''
        env:
          CMD: ${{ inputs.pre_commit_command }}
        run: bash -c "$CMD"
      - name: Lint
        if: inputs.lint_command != ''
        env:
          CMD: ${{ inputs.lint_command }}
        run: bash -c "$CMD"
      - name: Format check
        if: inputs.format_command != ''
        env:
          CMD: ${{ inputs.format_command }}
        run: bash -c "$CMD"
      - name: Django system check
        if: inputs.django_check_command != ''
        env:
          CMD: ${{ inputs.django_check_command }}
        run: bash -c "$CMD"
      - name: Tests
        if: inputs.test_command != ''
        env:
          CMD: ${{ inputs.test_command }}
        run: bash -c "$CMD"

  gitleaks:
    name: Gitleaks
    if: contains(toJSON(inputs), '"python_versions"') && inputs.run_gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$url" -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" /tmp/gitleaks.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ] && [ -n "${PR_BASE_SHA:-}" ]; then
            gitleaks detect --no-banner --redact --source=. --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            gitleaks detect --no-banner --redact --source=.
          fi
      - name: Scan the working tree
        run: gitleaks dir --no-banner --redact .

  quality_gate:
    name: Quality Gate
    needs: [quality, gitleaks]
    if: always() && !cancelled() && contains(toJSON(inputs), '"python_versions"')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require quality and requested Gitleaks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          RUN_GITLEAKS: ${{ inputs.run_gitleaks }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          if [ "$RUN_GITLEAKS" = true ]; then
            test "$GITLEAKS_RESULT" = success
          else
            test "$GITLEAKS_RESULT" = skipped
          fi
