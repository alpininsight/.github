---
# =============================================================================
# Feature CI - organization quality gate
# =============================================================================
# Contributor template only.
#
# The actual workflow implementation is maintained in:
#   alpininsight/.github-private/.github/workflows/reusable-ci.yml@main
#
# Keep this repository-local file small. If the CI process needs to change,
# update .github-private first and then refresh this template.
# =============================================================================

name: Feature CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repository Policy
    uses: alpininsight/.github-private/.github/workflows/reusable-ci.yml@main
    with:
      python-version: "3.13"
      coverage-package: ""
      run-mypy: true
      run-docker-build: true
      generate-fernet-key: false
    secrets: inherit
