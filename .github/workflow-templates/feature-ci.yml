---
# =============================================================================
# Alpin Insight workflow template
# Source:
#   - public template: alpininsight/.github/.github/workflow-templates/feature-ci.yml
#   - private backends:
# yamllint disable-line rule:line-length
#     - alpininsight/.github-private/.github/workflows/repository-policy-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
# yamllint disable-line rule:line-length
#     - alpininsight/.github-private/.github/workflows/python-django-quality-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
# Purpose:
#   - copies the standard Alpin Insight CI caller into the target repository
#   - keeps policy and quality logic private and centrally maintained
# When copied:
#   - keep this header so the source remains visible in downstream repos
#   - adjust python_versions and optional commands for your repository as needed
# =============================================================================

name: Standard CI (Alpin Insight)

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    # yamllint disable-line rule:line-length
    uses: alpininsight/.github-private/.github/workflows/repository-policy-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0

  quality:
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: alpininsight/.github-private/.github/workflows/python-django-quality-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
    with:
      python_versions: '["3.13"]'
    secrets:
      github_read_token: ${{ secrets.GITHUB_READ_TOKEN }}
