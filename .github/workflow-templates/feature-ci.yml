---
# =============================================================================
# Feature CI - organization quality gate
# =============================================================================
# Contributor template only.
#
# Public repositories cannot call private reusable workflows. This public
# template therefore calls the public reusable workflow mirror. The process is
# still led by .github-private; update the private source first, then mirror the
# public-compatible change here.
#
# Keep this repository-local file small. If the CI process needs to change,
# update .github-private first and then refresh this template/public mirror.
# =============================================================================

name: Feature CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python/Django Quality
    uses: alpininsight/.github/.github/workflows/python-django-quality-reusable.yml@main
    with:
      python_versions: '["3.12", "3.13", "3.14"]'
      pre_commit_command: "SKIP=no-commit-to-branch uvx pre-commit run --all-files"
    secrets:
      github_read_token: ${{ secrets.INSIGHT_TOKEN_RO }}
