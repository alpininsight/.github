---
# =============================================================================
# Alpine Insight public workflow template
# Source:
#   - public mirror: alpininsight/.github/.github/workflows/reusable-release.yml@main
#   - private process source: alpininsight/.github-private/.github/workflows/reusable-release.yml@main
# Purpose:
#   - gives public repositories a thin GitVersion release caller
#   - keeps the public mirror aligned with the private organization standard
# =============================================================================

name: Release (Alpine Insight)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: alpininsight/.github/.github/workflows/reusable-release.yml@main
