---
# =============================================================================
# Release - organization release workflow
# =============================================================================
# Contributor template only.
#
# The actual workflow implementation is maintained in:
#   alpininsight/.github-private/.github/workflows/reusable-release.yml@main
#
# Repositories may pass kustomize-image-name when the release should also pin
# a container image tag in k8s/base/kustomization.yaml.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: alpininsight/.github-private/.github/workflows/reusable-release.yml@main
    with:
      python-version: "3.13"
      kustomize-image-name: ""
    secrets: inherit
