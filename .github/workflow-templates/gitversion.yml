---
# =============================================================================
# Alpin Insight workflow template
# Source:
#   - public template: alpininsight/.github/.github/workflow-templates/gitversion.yml
# yamllint disable-line rule:line-length
#   - private backend: alpininsight/.github-private/.github/workflows/gitversion-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
# Purpose:
#   - copies a thin GitVersion caller into the target repository
#   - keeps org versioning logic private and centrally maintained
# When copied:
#   - keep this header so the source remains visible in downstream repos
#   - pair this workflow with the Alpin Insight release template
# =============================================================================

name: GitVersion (Alpin Insight)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: gitversion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calculate-version:
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: alpininsight/.github-private/.github/workflows/gitversion-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
    with:
      config_file_path: GitVersion.yml
