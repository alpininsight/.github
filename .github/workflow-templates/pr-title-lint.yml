---
# =============================================================================
# PR title - Conventional Commits gate
# =============================================================================
# Public-compatible Contributor template.
#
# Public repositories cannot call private reusable workflows. Keep this local
# template aligned with the policy in .github-private/reusable-pr-title.yml.
# =============================================================================

name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
            build
            style
          requireScope: false
          allowBreakingChanges: true
