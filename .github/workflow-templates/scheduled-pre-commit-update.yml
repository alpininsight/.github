name: Scheduled pre-commit update (Alpin Insight)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  autoupdate:
    permissions:
      contents: write
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: alpininsight/.github-private/.github/workflows/scheduled-pre-commit-update-reusable.yml@ebb61f771e31cd42670875a5faaa58dfef64842a  # v0.3.0
    secrets:
      automation_token: ${{ secrets.INSIGHT_TOKEN }}
